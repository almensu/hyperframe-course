<!doctype html>
<html lang="zh-CN">
  <head>

    <title>00-03 Track and Layer</title>
    <style>
      * { box-sizing: border-box; }

    <main id="stage" data-composition-id="track-and-layer" data-start="0" data-duration="5" data-width="1920" data-height="1080" data-no-timeline>
      <div class="clip background" data-start="0" data-duration="5" data-track-index="0"></div>
      <div class="clip orb" data-start="0.5" data-duration="4" data-track-index="1"></div>
      <div class="clip headline" data-start="1" data-duration="3" data-track-index="2">Track 组织时间，<br />z-index 组织覆盖。</div>
