<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>00-04 Frame Seeking</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #05070c; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .frame-card { position: absolute; inset: 0; display: grid; place-items: center; font-size: 112px; font-weight: 800; letter-spacing: -0.04em; }
      .one { color: #07111f; background: #73e3ff; }
      .two { color: #fff; background: #4a39d7; }
      .three { color: #171008; background: #ffb84f; }
    </style>
  </head>
  <body>
    <main id="stage" data-composition-id="frame-seeking" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section class="clip frame-card one" data-start="0" data-duration="2" data-track-index="0">FRAME 0—59</section>
      <section class="clip frame-card two" data-start="2" data-duration="2" data-track-index="0">FRAME 60—119</section>
      <section class="clip frame-card three" data-start="4" data-duration="2" data-track-index="0">FRAME 120—179</section>
    </main>
  </body>
</html>
